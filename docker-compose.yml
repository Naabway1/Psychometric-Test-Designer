services:
  app:
    build:
      context: "./Psychometric Test Designer"
      dockerfile: Dockerfile
    container_name: psychometric-test-designer-app
    depends_on:
      - db
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - UseHttpsRedirection=false
      - ConnectionStrings__Default=Host=db;Port=5432;Database=psychometric_db;Username=postgres;Password=12345
      - POSTGRES_DB=psychometric_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    restart: unless-stopped

  frontend:
    build:
      context: "./PsychometricTestDesigner.Frontend"
      dockerfile: Dockerfile
    container_name: psychometric-test-designer-frontend
    depends_on:
      - app
    ports:
      - "5172:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiBaseUrl=http://app:80
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: psychometric-test-designer-db
    environment:
      - POSTGRES_DB=psychometric_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tables.sql:/docker-entrypoint-initdb.d/tables.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres-data:
    name: psychometric-test-designer-postgres-data
